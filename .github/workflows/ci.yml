name: IoT Backend CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint and Test Code
    runs-on: ubuntu-latest

    steps:
      # Step 1: ดึงซอร์สโค้ดจาก Repository ลงมาใน Runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: ติดตั้ง Node.js สภาพแวดล้อมจำลอง (เวอร์ชัน 18)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: ติดตั้ง Dependencies ทั้งหมดแบบสะอาด (Clean Install)
      - name: Install Project Dependencies
        run: npm ci

      # Step 4: รันคำสั่งตรวจสอบโค้ด (Linter)
      - name: Run Linter (Code Quality Check)
        run: npm run lint

      # Step 5: รันคำสั่ง Automated Unit Tests ทั้งหมด
      - name: Run Unit Tests
        run: npm test